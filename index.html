<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PECS Eye</title><style>
:root{--bg:#f4f6fa;--ink:#172033;--line:#d5dae5;--blue:#2563eb;--green:#15803d;--card:175px}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}button,select{font:inherit}.app{max-width:1500px;margin:auto;padding:12px;display:grid;gap:10px;min-height:100vh}.top,.tabs,.toolbar,.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.title{font-size:clamp(26px,3vw,38px);font-weight:950;margin-right:auto}.pill,.tab,.toolbar button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;font-weight:900}.pill.primary{background:var(--blue);color:#fff}.sentence{background:#fff;border:3px solid #aeb6c7;border-radius:20px;padding:12px;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;min-height:120px}.sentence-cards{display:flex;gap:8px;overflow:auto;min-height:72px;align-items:center}.sentence-card{border:3px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font-size:21px;font-weight:900}.big{border:0;border-radius:18px;padding:16px;font-size:22px;font-weight:950;min-height:76px}.speak{background:var(--green);color:#fff}.clear{background:#fff1f0;color:#b42318}.tab.active{background:#e8efff;border-color:var(--blue)}.board{background:#fff;border:3px solid var(--line);border-radius:20px;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(var(--card),1fr));gap:16px}.card{position:relative;min-height:190px;border:4px solid #cfd5e2;border-radius:18px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px}.card.gaze{border-color:var(--blue);box-shadow:0 0 0 5px #2563eb22}.emoji{font-size:72px}.label{font-size:clamp(23px,2.5vw,32px);font-weight:950}.dwell{position:absolute;inset:5px;border-radius:14px;pointer-events:none;background:conic-gradient(var(--blue) var(--p,0%),transparent 0);opacity:0;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;-webkit-mask-composite:xor;padding:7px}.gaze .dwell{opacity:1}.status{font-size:14px;color:#667085}.dot{width:12px;height:12px;border-radius:50%;background:#98a2b3}.dot.on{background:#16a34a}.dot.warn{background:#f59e0b}.cursor{position:fixed;width:40px;height:40px;border:5px solid #ef4444;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:9998;display:none;box-shadow:0 0 0 6px #fff9}.cursor.on{display:block}.cal{position:fixed;inset:0;background:#eef2f7;z-index:9999;display:none}.cal.on{display:block}.calbar{position:absolute;z-index:10002;left:8px;right:8px;top:6px;min-height:46px;background:#ffffffee;border:2px solid var(--line);border-radius:12px;padding:7px 84px 7px 10px;font-weight:800;font-size:14px;line-height:1.35}.calbar strong{font-size:16px}.calbar button{position:absolute;right:8px;top:7px;padding:6px 10px}.calpoint{position:absolute;width:92px;height:92px;border-radius:50%;border:7px solid #fff;background:var(--blue);color:#fff;font-size:18px;font-weight:950;display:grid;place-items:center;box-shadow:0 5px 22px #0003;z-index:10000;outline:9px solid #93c5fd;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.08)}}.error{color:#b42318}.modal{position:fixed;inset:0;background:#0008;z-index:100;display:none;place-items:center;padding:12px}.modal.open{display:grid}.dialog{width:min(860px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:22px;padding:18px}.row{display:flex;gap:12px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:170px}.field select{padding:10px;border:2px solid var(--line);border-radius:10px}.help{background:#f8fafc;border:2px solid #e2e8f0;border-radius:14px;padding:12px;line-height:1.6;margin-top:12px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}.actions button{padding:10px 14px;border:0;border-radius:11px;font-weight:850}.primarybtn{background:var(--blue);color:#fff}.secondary{background:#eef2ff}@media(max-width:760px){.sentence{grid-template-columns:1fr 1fr}.sentence>div:first-child{grid-column:1/-1}:root{--card:140px}.card{min-height:170px}.emoji{font-size:60px}.calbar{font-size:12px;padding-right:76px}.calbar strong{font-size:14px}.calpoint{width:76px;height:76px}}
</style></head><body><div class="app"><header class="top"><div class="title">👀 PECS Eye</div><button class="pill" id="pointerBtn">🖱 外部視線／マウス</button><button class="pill primary" id="cameraBtn">📷 カメラ視線を始める</button><button class="pill" id="settingsBtn">⚙️ 先生用設定</button></header><section class="sentence"><div><b>できた ことば</b><div id="sentence" class="sentence-cards"></div></div><button id="speakBtn" class="big speak gazeable">🔊 つたえる<div class="dwell"></div></button><button id="clearBtn" class="big clear gazeable">🗑 けす<div class="dwell"></div></button></section><nav id="tabs" class="tabs"></nav><div class="toolbar"><button id="starterBtn">🙋 わたしは</button><button id="wantBtn">💭 ほしい</button><button id="undoBtn">↩ 1つもどす</button></div><main class="board"><div id="grid" class="grid"></div></main><footer class="status"><span id="dot" class="dot"></span><b id="mode">操作：タッチ／マウス／外部視線装置</b><span id="status">カードをえらんでね</span><span>注視：<b id="dwellText"></b></span><span>安定性：<b id="stabilityText"></b></span></footer></div><div id="cursor" class="cursor"></div>
<div id="cal" class="cal"><div class="calbar"><strong>👀 視線調整</strong>　<span id="instruction">カメラを準備しています。</span>　<span id="calStatus">準備中…</span> <span id="error" class="error"></span><button id="cancelCal">中止</button></div></div>
<div id="settings" class="modal"><div class="dialog"><h2>先生用設定</h2><div class="row"><label class="field">注視時間<select id="dwellSelect"><option value="500">0.5秒</option><option value="800">0.8秒</option><option value="1200">1.2秒</option><option value="1800">1.8秒</option><option value="2500">2.5秒</option><option value="3000">3.0秒</option></select></label><label class="field">カードサイズ<select id="sizeSelect"><option value="130">小</option><option value="175">標準</option><option value="215">大</option><option value="255">特大</option></select></label><label class="field">視線の安定性<select id="stabilitySelect"><option value="high">高（おすすめ）</option><option value="normal">標準</option><option value="fast">反応優先</option></select></label><label class="field">視線調整<select id="calModeSelect"><option value="quick">かんたん 5点×1回</option><option value="precise">高精度 9点×1回</option></select></label></div><div class="help"><b>かんたん調整：</b>青い丸を見て先生が1回タッチするだけです。1回のタッチ後、アプリが同じ位置の学習データを自動で追加します。<br><b>安定性「高」：</b>細かな揺れを抑え、カードから少し視線が外れてもすぐには選択を解除しません。Webカメラ方式なので専用視線装置ほどの精度は出ませんが、PECSの大きな選択肢向けに安定性を優先しています。</div><div class="actions"><button class="secondary" id="recalBtn">🎯 再調整</button><button class="secondary" id="stopBtn">■ カメラ停止</button><button class="primarybtn" id="closeBtn">閉じる</button></div></div></div>
<script>
const CARDS=[['juice','ジュース','ジュース','🥤','のみもの'],['tea','おちゃ','おちゃ','🍵','のみもの'],['water','みず','みず','💧','のみもの'],['milk','ぎゅうにゅう','ぎゅうにゅう','🥛','のみもの'],['apple','りんご','りんご','🍎','たべもの'],['banana','バナナ','バナナ','🍌','たべもの'],['cookie','おかし','おかし','🍪','たべもの'],['rice','ごはん','ごはん','🍚','たべもの'],['music','おんがく','おんがくを したい','🎵','かつどう'],['outside','そと','そとに いきたい','🌳','かつどう'],['break','やすむ','やすみたい','🛋️','かつどう'],['toilet','トイレ','トイレに いきたい','🚻','かつどう'],['again','もう1かい','もう いっかい','🔁','ことば'],['help','てつだって','てつだって ください','🙋','ことば'],['finish','おわり','おわりに します','🏁','ことば'],['no','いや','いやです','✋','ことば'],['yes','はい','はい','⭕','ことば'],['more','もっと','もっと ください','➕','ことば']].map(x=>({id:x[0],label:x[1],speech:x[2],emoji:x[3],category:x[4]}));
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let category=load('pecsEyeCat','のみもの'),sentence=[],dwellMs=+load('pecsEyeDwell',1200),cardSize=+load('pecsEyeSize',175),stability=load('pecsEyeStability','high'),calMode=load('pecsEyeCalMode','quick');let dwellTarget=null,dwellStart=0,dwellRAF=0,cameraMode=false,calibrating=false,calIndex=0,gazeSeen=false,gazeBuffer=[],fx=null,fy=null,pendingTarget=null,pendingSince=0,lastTargetSeen=0;
const cats=['のみもの','たべもの','かつどう','ことば'];const QUICK=[[14,22],[86,22],[50,50],[14,80],[86,80]],PRECISE=[[14,20],[50,20],[86,20],[14,50],[50,50],[86,50],[14,80],[50,80],[86,80]];const CFG={high:{n:11,a:.13,d:24,step:65,hold:190,grace:260,pad:34,label:'高'},normal:{n:7,a:.23,d:14,step:95,hold:125,grace:180,pad:26,label:'標準'},fast:{n:5,a:.36,d:7,step:140,hold:70,grace:110,pad:18,label:'反応優先'}};
function cfg(){return CFG[stability]||CFG.high}function calPoints(){return calMode==='precise'?PRECISE:QUICK}function resetFilter(){gazeBuffer=[];fx=fy=null;pendingTarget=null;pendingSince=lastTargetSeen=0;clearDwell()}function median(v){const a=[...v].sort((x,y)=>x-y),m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2}function filterPoint(x,y){const c=cfg();if(x<-100||y<-100||x>innerWidth+100||y>innerHeight+100)return null;gazeBuffer.push({x,y});while(gazeBuffer.length>c.n)gazeBuffer.shift();const mx=median(gazeBuffer.map(v=>v.x)),my=median(gazeBuffer.map(v=>v.y));if(fx===null){fx=mx;fy=my;return{x:fx,y:fy}}let tx=fx+c.a*(mx-fx),ty=fy+c.a*(my-fy),dx=tx-fx,dy=ty-fy,dist=Math.hypot(dx,dy);if(dist<c.d)return{x:fx,y:fy};if(dist>c.step){const k=c.step/dist;tx=fx+dx*k;ty=fy+dy*k}fx=Math.max(0,Math.min(innerWidth,tx));fy=Math.max(0,Math.min(innerHeight,ty));return{x:fx,y:fy}}
function render(){document.documentElement.style.setProperty('--card',cardSize+'px');$('#tabs').innerHTML=cats.map(c=>`<button class="tab ${c===category?'active':''}" data-cat="${c}">${c}</button>`).join('');$$('.tab').forEach(b=>b.onclick=()=>{category=b.dataset.cat;save('pecsEyeCat',category);render()});$('#grid').innerHTML=CARDS.filter(c=>c.category===category).map(c=>`<button class="card gazeable" data-id="${c.id}"><div class="emoji">${c.emoji}</div><div class="label">${c.label}</div><div class="dwell"></div></button>`).join('');$$('.card').forEach(b=>b.onclick=()=>choose(b.dataset.id));bindPointer();renderSentence()}
function renderSentence(){const b=$('#sentence');b.innerHTML=sentence.length?sentence.map((x,i)=>`<button class="sentence-card" data-i="${i}">${x.emoji||''} ${x.label}</button>`).join(''):'<span style="color:#98a2b3;font-size:22px;font-weight:800">カードを えらんでね</span>';$$('.sentence-card').forEach(b=>b.onclick=()=>{sentence.splice(+b.dataset.i,1);renderSentence()})}function choose(id){const c=CARDS.find(x=>x.id===id);if(c){sentence.push(c);renderSentence();$('#status').textContent=`「${c.label}」を えらびました`}}function fixed(label,speech,emoji){sentence.push({label,speech,emoji});renderSentence()}function speak(){if(!sentence.length)return;const u=new SpeechSynthesisUtterance(sentence.map(x=>x.speech||x.label).join(' '));u.lang='ja-JP';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}
function clearDwell(){if(dwellRAF)cancelAnimationFrame(dwellRAF);if(dwellTarget){dwellTarget.classList.remove('gaze');const d=dwellTarget.querySelector('.dwell');if(d)d.style.setProperty('--p','0%')}dwellTarget=null;dwellRAF=0}function startDwell(el){if(!el||dwellTarget===el)return;clearDwell();dwellTarget=el;dwellStart=performance.now();el.classList.add('gaze');const d=el.querySelector('.dwell');const tick=()=>{if(!dwellTarget)return;const p=Math.min(100,(performance.now()-dwellStart)/dwellMs*100);if(d)d.style.setProperty('--p',p+'%');if(p>=100){const t=dwellTarget;clearDwell();if(t.dataset.id)choose(t.dataset.id);else t.click()}else dwellRAF=requestAnimationFrame(tick)};dwellRAF=requestAnimationFrame(tick)}function bindPointer(){$$('.gazeable').forEach(el=>{el.onpointerenter=()=>{if(!cameraMode)startDwell(el)};el.onpointerleave=()=>{if(!cameraMode)clearDwell()}})}
function targetNear(x,y){const p=cfg().pad;let best=null,bd=Infinity;for(const el of $$('.gazeable')){const r=el.getBoundingClientRect();if(x>=r.left-p&&x<=r.right+p&&y>=r.top-p&&y<=r.bottom+p){const d=Math.hypot(x-(r.left+r.right)/2,y-(r.top+r.bottom)/2);if(d<bd){bd=d;best=el}}}return best}function manageTarget(t){const now=performance.now(),c=cfg();if(t){lastTargetSeen=now;if(pendingTarget!==t){pendingTarget=t;pendingSince=now;if(dwellTarget!==t)clearDwell()}else if(now-pendingSince>=c.hold&&dwellTarget!==t)startDwell(t)}else if(now-lastTargetSeen>c.grace){pendingTarget=null;pendingSince=0;clearDwell()}}
function handleGaze(x,y){if(!cameraMode||calibrating||!Number.isFinite(x)||!Number.isFinite(y))return;gazeSeen=true;const p=filterPoint(x,y);if(!p)return;const cur=$('#cursor');cur.style.left=p.x+'px';cur.style.top=p.y+'px';cur.classList.add('on');manageTarget(targetNear(p.x,p.y))}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.crossOrigin='anonymous';s.onload=res;s.onerror=()=>rej(new Error('視線ライブラリを読み込めません: '+src));document.head.appendChild(s)})}async function loadWebgazer(){if(window.webgazer)return;try{await loadScript('https://cdn.jsdelivr.net/npm/webgazer@3.5.3/dist/webgazer.js')}catch{await loadScript('https://webgazer.cs.brown.edu/webgazer.js')}if(!window.webgazer)throw new Error('WebGazerが見つかりません')}const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function showCalPoint(){document.querySelectorAll('.calpoint').forEach(x=>x.remove());const pts=calPoints();if(calIndex>=pts.length){finishCalibration();return}const [x,y]=pts[calIndex],b=document.createElement('button');b.className='calpoint';b.style.left=`calc(${x}% - 46px)`;b.style.top=`calc(${y}% - 46px)`;b.textContent='1回';b.onclick=async e=>{b.disabled=true;b.textContent='記録中';const r=b.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;try{for(let i=0;i<5;i++){webgazer.recordScreenPosition(cx,cy,'click');await sleep(55)}}catch{}calIndex++;showCalPoint()};$('#cal').appendChild(b);$('#instruction').textContent=`青い丸 ${calIndex+1}/${pts.length} を見て、1回だけタッチ`}
function finishCalibration(){calibrating=false;resetFilter();$('#cal').classList.remove('on');$('#cursor').classList.add('on');$('#dot').className='dot on';$('#status').textContent='視線入力中：視線をゆっくりカードへ向けてください';setTimeout(()=>{if(cameraMode&&!gazeSeen)$('#status').textContent='顔をカメラ正面に合わせてください。'},3000)}function errText(e){return `${e?.name||'Error'}: ${e?.message||String(e)}`}
async function startCamera(){await stopCamera(false);cameraMode=true;calibrating=true;calIndex=0;gazeSeen=false;resetFilter();$('#cal').classList.add('on');$('#error').textContent='';$('#instruction').textContent='カメラと視線モデルを準備しています。';$('#calStatus').textContent='準備中…';$('#dot').className='dot warn';$('#mode').textContent='操作：Webカメラ視線';try{if(!window.isSecureContext)throw new Error('HTTPSではありません');if(!navigator.mediaDevices?.getUserMedia)throw new Error('このブラウザはカメラAPIに対応していません');await loadWebgazer();if(webgazer.params)webgazer.params.faceMeshSolutionPath='https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619';try{webgazer.saveDataAcrossSessions(false);webgazer.applyKalmanFilter(true)}catch{}try{webgazer.setCameraConstraints({video:{width:{ideal:640},height:{ideal:480},facingMode:'user'},audio:false})}catch{}webgazer.setGazeListener(d=>{if(d)handleGaze(d.x,d.y)});try{webgazer.setRegression('ridge')}catch{}await webgazer.begin(()=>{$('#calStatus').textContent='カメラを開けませんでした。'});try{webgazer.showVideo(true);webgazer.showFaceOverlay(true);webgazer.showFaceFeedbackBox(true);webgazer.showPredictionPoints(false)}catch{}$('#calStatus').textContent='準備完了';showCalPoint()}catch(e){cameraMode=false;calibrating=false;$('#dot').className='dot';$('#mode').textContent='操作：タッチ／マウス／外部視線装置';$('#calStatus').textContent='開始できませんでした。';$('#error').textContent=errText(e)}}async function stopCamera(close=true){cameraMode=false;calibrating=false;gazeSeen=false;resetFilter();$('#cursor').classList.remove('on');$('#dot').className='dot';$('#mode').textContent='操作：タッチ／マウス／外部視線装置';try{if(window.webgazer)await webgazer.end()}catch{}if(close)$('#cal').classList.remove('on')}
$('#cameraBtn').onclick=startCamera;$('#pointerBtn').onclick=()=>stopCamera();$('#cancelCal').onclick=()=>stopCamera();$('#speakBtn').onclick=speak;$('#clearBtn').onclick=()=>{sentence=[];renderSentence()};$('#undoBtn').onclick=()=>{sentence.pop();renderSentence()};$('#starterBtn').onclick=()=>fixed('わたしは','わたしは','🙋');$('#wantBtn').onclick=()=>fixed('ほしい','ほしいです','💭');$('#settingsBtn').onclick=()=>{$('#dwellSelect').value=dwellMs;$('#sizeSelect').value=cardSize;$('#stabilitySelect').value=stability;$('#calModeSelect').value=calMode;$('#settings').classList.add('open')};$('#closeBtn').onclick=()=>$('#settings').classList.remove('open');$('#dwellSelect').onchange=e=>{dwellMs=+e.target.value;save('pecsEyeDwell',dwellMs);$('#dwellText').textContent=(dwellMs/1000).toFixed(1)+'秒'};$('#sizeSelect').onchange=e=>{cardSize=+e.target.value;save('pecsEyeSize',cardSize);render()};$('#stabilitySelect').onchange=e=>{stability=e.target.value;save('pecsEyeStability',stability);resetFilter();$('#stabilityText').textContent=cfg().label};$('#calModeSelect').onchange=e=>{calMode=e.target.value;save('pecsEyeCalMode',calMode)};$('#recalBtn').onclick=()=>{$('#settings').classList.remove('open');if(cameraMode){calibrating=true;calIndex=0;resetFilter();$('#cal').classList.add('on');showCalPoint()}else startCamera()};$('#stopBtn').onclick=()=>{stopCamera();$('#settings').classList.remove('open')};$('#dwellText').textContent=(dwellMs/1000).toFixed(1)+'秒';$('#stabilityText').textContent=cfg().label;render();
</script></body></html>

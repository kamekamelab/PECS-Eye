<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PECS Eye</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#172033;--muted:#667085;--line:#d5dae5;--accent:#2563eb;--ok:#15803d;--danger:#b42318;--card:175px;--gap:16px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{max-width:1500px;margin:auto;padding:12px;display:grid;grid-template-rows:auto auto auto 1fr auto;gap:10px;min-height:100vh}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.title{font-weight:950;font-size:clamp(25px,3vw,38px);margin-right:auto}.pill{border:2px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-weight:900}.pill.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.sentence{background:#fff;border:3px solid #aeb6c7;border-radius:20px;padding:12px;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;min-height:120px}.sentence-head{font-size:14px;color:var(--muted);font-weight:900;margin-bottom:7px}.sentence-cards{display:flex;gap:8px;align-items:center;overflow-x:auto;min-height:72px}.sentence-card{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:3px solid var(--line);border-radius:14px;background:#fff;padding:7px 10px;font-size:21px;font-weight:900}.sentence-card .emoji{font-size:34px}.bigaction{border:0;border-radius:18px;padding:16px 18px;font-size:22px;font-weight:950;min-height:76px}.speak{background:var(--ok);color:#fff}.clear{background:#fff1f0;color:var(--danger);border:2px solid #fecaca}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:3px 0}.tab{flex:0 0 auto;border:3px solid #cfd5e2;background:#fff;border-radius:14px;padding:10px 16px;font-size:18px;font-weight:900}.tab.active{background:#e8efff;border-color:var(--accent);color:#1747a6}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-weight:850}.board{background:#fff;border:3px solid var(--line);border-radius:20px;padding:14px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(var(--card),1fr));gap:var(--gap)}
.card{position:relative;min-height:190px;border:4px solid #cfd5e2;border-radius:18px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center;overflow:hidden}.card.gaze,.card:hover{border-color:var(--accent);box-shadow:0 0 0 4px #2563eb22}.card .emoji{font-size:76px}.card .label{font-size:clamp(23px,2.5vw,32px);font-weight:950}.dwell{position:absolute;inset:5px;border-radius:14px;pointer-events:none;background:conic-gradient(var(--accent) var(--p,0%),transparent 0);opacity:0;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;-webkit-mask-composite:xor;padding:7px}.gazeable.gaze .dwell{opacity:1}.status{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:14px}.dot{width:11px;height:11px;border-radius:50%;background:#98a2b3}.dot.on{background:#16a34a}.dot.warn{background:#f59e0b}
.gaze-cursor{position:fixed;width:34px;height:34px;border:5px solid #ef4444;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:9998;display:none;box-shadow:0 0 0 6px #fff8}.gaze-cursor.on{display:block}
.calibration{position:fixed;inset:0;background:#eef2f7;z-index:9999;display:none}.calibration.on{display:block}.cal-note{position:absolute;left:50%;top:2%;transform:translateX(-50%);width:min(760px,94%);background:#fff;border:3px solid #cfd5e2;border-radius:18px;padding:11px 14px;text-align:center;font-weight:850;z-index:10002}.calpoint{position:absolute;width:88px;height:88px;border-radius:50%;border:6px solid #fff;background:#2563eb;color:#fff;font-size:21px;font-weight:950;display:grid;place-items:center;box-shadow:0 5px 22px #0003;z-index:10000}.calpoint.active{outline:8px solid #93c5fd;animation:pulse 1s infinite}.calpoint.done{background:#16a34a}.calpoint.hidden{display:none}@keyframes pulse{50%{transform:scale(1.08)}}.cal-status{margin-top:6px;color:#475467}.camera-message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:12px 16px;border-radius:14px;border:2px solid #cfd5e2;font-weight:850;z-index:10001;display:none;max-width:min(720px,90%);line-height:1.6}.camera-message.on{display:block}
.modal{position:fixed;inset:0;background:#0008;z-index:100;display:none;place-items:center;padding:12px}.modal.open{display:grid}.dialog{width:min(850px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:22px;padding:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.field select{border:2px solid var(--line);border-radius:10px;padding:10px}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.actions button{border:0;border-radius:11px;padding:10px 14px;font-weight:850}.secondary{background:#eef2ff}.primarybtn{background:var(--accent);color:#fff}.help{background:#f8fafc;border:2px solid #e2e8f0;border-radius:14px;padding:12px;line-height:1.65}
@media(max-width:760px){:root{--card:140px;--gap:10px}.sentence{grid-template-columns:1fr 1fr}.sentence>div:first-child{grid-column:1/-1}.row{grid-template-columns:1fr}.card{min-height:170px}.card .emoji{font-size:62px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="title">👀 PECS Eye</div><button class="pill" id="pointerModeBtn">🖱 外部視線／マウス</button><button class="pill primary" id="cameraStartBtn">📷 カメラ視線を始める</button><button class="pill" id="settingsBtn">⚙️ 先生用設定</button></header>
<section class="sentence"><div><div class="sentence-head">できた ことば</div><div id="sentenceCards" class="sentence-cards"></div></div><button id="speakBtn" class="bigaction speak gazeable">🔊 つたえる<div class="dwell"></div></button><button id="clearBtn" class="bigaction clear gazeable">🗑 けす<div class="dwell"></div></button></section>
<nav id="tabs" class="tabs"></nav>
<div class="toolbar"><button id="starterBtn">🙋 わたしは</button><button id="wantBtn">💭 ほしい</button><button id="undoBtn">↩ 1つもどす</button></div>
<main class="board"><div class="grid" id="cardGrid"></div></main>
<footer class="status"><span id="gazeDot" class="dot"></span><b id="modeText">操作：タッチ／マウス／外部視線装置</b><span id="statusText">カードをえらんでね</span><span>注視：<b id="dwellText"></b></span></footer>
</div>
<div id="gazeCursor" class="gaze-cursor"></div>
<div id="calibration" class="calibration">
 <div class="cal-note"><div style="font-size:22px">視線の準備</div><div id="calInstruction">カメラを準備しています。</div><div id="calStatus" class="cal-status">準備中…</div><button id="cancelCal" style="margin-top:6px;padding:7px 12px">中止</button></div>
 <div id="cameraMessage" class="camera-message"></div>
</div>
<div id="settingsModal" class="modal"><div class="dialog"><h2>先生用設定</h2><div class="row"><div class="field"><label>注視で決定する時間</label><select id="dwellSelect"><option value="500">0.5秒</option><option value="800">0.8秒</option><option value="1200">1.2秒</option><option value="1800">1.8秒</option><option value="2500">2.5秒</option><option value="3000">3.0秒</option></select></div><div class="field"><label>カードの大きさ</label><select id="sizeSelect"><option value="130">小</option><option value="175">標準</option><option value="215">大</option><option value="255">特大</option></select></div></div><div class="help"><b>カメラ視線：</b>カメラ準備後、青い丸が1つずつ表示されます。その丸を見たまま教師が5回クリックしてください。9か所終わると視線カーソルが始まります。<br><b>外部視線：</b>Tobiiなどがマウスポインタを動かす場合は、そのままカード上で注視できます。</div><hr><div class="actions"><button class="secondary" id="recalibrateBtn">🎯 再キャリブレーション</button><button class="secondary" id="stopCameraBtn">■ カメラ視線を停止</button><button class="primarybtn" id="closeSettingsBtn">閉じる</button></div></div></div>
<script>
const DEFAULT_CARDS=[
{id:'juice',label:'ジュース',speech:'ジュース',emoji:'🥤',category:'のみもの'},{id:'tea',label:'おちゃ',speech:'おちゃ',emoji:'🍵',category:'のみもの'},{id:'water',label:'みず',speech:'みず',emoji:'💧',category:'のみもの'},{id:'milk',label:'ぎゅうにゅう',speech:'ぎゅうにゅう',emoji:'🥛',category:'のみもの'},
{id:'apple',label:'りんご',speech:'りんご',emoji:'🍎',category:'たべもの'},{id:'banana',label:'バナナ',speech:'バナナ',emoji:'🍌',category:'たべもの'},{id:'cookie',label:'おかし',speech:'おかし',emoji:'🍪',category:'たべもの'},{id:'rice',label:'ごはん',speech:'ごはん',emoji:'🍚',category:'たべもの'},
{id:'music',label:'おんがく',speech:'おんがくを したい',emoji:'🎵',category:'かつどう'},{id:'outside',label:'そと',speech:'そとに いきたい',emoji:'🌳',category:'かつどう'},{id:'break',label:'やすむ',speech:'やすみたい',emoji:'🛋️',category:'かつどう'},{id:'toilet',label:'トイレ',speech:'トイレに いきたい',emoji:'🚻',category:'かつどう'},
{id:'again',label:'もう1かい',speech:'もう いっかい',emoji:'🔁',category:'ことば'},{id:'help',label:'てつだって',speech:'てつだって ください',emoji:'🙋',category:'ことば'},{id:'finish',label:'おわり',speech:'おわりに します',emoji:'🏁',category:'ことば'},{id:'no',label:'いや',speech:'いやです',emoji:'✋',category:'ことば'},{id:'yes',label:'はい',speech:'はい',emoji:'⭕',category:'ことば'},{id:'more',label:'もっと',speech:'もっと ください',emoji:'➕',category:'ことば'}];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const load=(k,d)=>{try{let v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let cards=load('pecsEyeCardsV3',DEFAULT_CARDS),category=load('pecsEyeCat','のみもの'),sentence=[],dwellMs=+load('pecsEyeDwell',1200),cardSize=+load('pecsEyeSize',175);let dwellTarget=null,dwellStart=0,dwellRAF=0,lastChosen=0,cameraMode=false,calibrating=false,calReady=false,calIndex=0,calClicks=0,watchdog=null;
const cats=['のみもの','たべもの','かつどう','ことば'];
function renderTabs(){if(!cats.includes(category))category=cats[0];$('#tabs').innerHTML=cats.map(c=>`<button class="tab gazeable ${c===category?'active':''}" data-cat="${c}">${c}</button>`).join('');$$('.tab').forEach(b=>b.onclick=()=>{category=b.dataset.cat;save('pecsEyeCat',category);renderTabs();renderCards()});bindPointer()}
function renderCards(){document.documentElement.style.setProperty('--card',cardSize+'px');$('#cardGrid').innerHTML=cards.filter(c=>c.category===category).map(c=>`<button class="card gazeable" data-id="${c.id}"><div class="emoji">${c.emoji||'🖼️'}</div><div class="label">${c.label}</div><div class="dwell"></div></button>`).join('');$$('.card').forEach(b=>b.onclick=()=>chooseById(b.dataset.id));bindPointer()}
function renderSentence(){let b=$('#sentenceCards');b.innerHTML=sentence.length?sentence.map((x,i)=>`<button class="sentence-card" data-i="${i}"><span class="emoji">${x.emoji||''}</span><span>${x.label}</span></button>`).join(''):'<span style="color:#98a2b3;font-size:22px;font-weight:800">カードを えらんでね</span>';$$('.sentence-card').forEach(x=>x.onclick=()=>{sentence.splice(+x.dataset.i,1);renderSentence()})}
function chooseById(id){let c=cards.find(x=>x.id===id);if(c){sentence.push({...c});renderSentence();setStatus(`「${c.label}」を えらびました`)}}
function addFixed(label,speech,emoji){sentence.push({label,speech,emoji});renderSentence()}
function speak(){if(!sentence.length)return;let u=new SpeechSynthesisUtterance(sentence.map(x=>x.speech||x.label).join(' '));u.lang='ja-JP';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}
function setStatus(t){$('#statusText').textContent=t}
function clearDwell(){if(dwellTarget){dwellTarget.classList.remove('gaze');let d=dwellTarget.querySelector('.dwell');if(d)d.style.setProperty('--p','0%')}dwellTarget=null;dwellStart=0;cancelAnimationFrame(dwellRAF)}
function activateTarget(t){if(Date.now()-lastChosen<450)return;lastChosen=Date.now();if(t.matches('.card'))chooseById(t.dataset.id);else if(t.matches('.tab')){category=t.dataset.cat;save('pecsEyeCat',category);renderTabs();renderCards()}else t.click();clearDwell()}
function dwellLoop(now){if(!dwellTarget)return;let p=Math.min(100,(now-dwellStart)/dwellMs*100),d=dwellTarget.querySelector('.dwell');if(d)d.style.setProperty('--p',p+'%');if(p>=100)activateTarget(dwellTarget);else dwellRAF=requestAnimationFrame(dwellLoop)}
function startDwell(t){if(dwellTarget===t)return;clearDwell();dwellTarget=t;dwellTarget.classList.add('gaze');dwellStart=performance.now();dwellRAF=requestAnimationFrame(dwellLoop)}
function bindPointer(){$$('.gazeable').forEach(el=>{el.onpointerenter=()=>{if(!cameraMode)startDwell(el)};el.onpointerleave=()=>{if(!cameraMode)clearDwell()}})}
function handleGaze(x,y){if(!cameraMode||calibrating||!Number.isFinite(x)||!Number.isFinite(y))return;let c=$('#gazeCursor');c.style.left=x+'px';c.style.top=y+'px';let el=document.elementFromPoint(x,y),target=el&&el.closest('.gazeable');target?startDwell(target):clearDwell()}
const calPts=[[12,18],[50,18],[88,18],[12,50],[50,50],[88,50],[12,82],[50,82],[88,82]];
function showCalPoint(){let ov=$('#calibration');ov.querySelectorAll('.calpoint').forEach(x=>x.remove());if(calIndex>=calPts.length){finishCalibration();return}let p=calPts[calIndex],b=document.createElement('button');b.className='calpoint active';b.style.left=`calc(${p[0]}% - 44px)`;b.style.top=`calc(${p[1]}% - 44px)`;b.textContent=`${calClicks}/5`;b.onclick=()=>{if(!calReady)return;calClicks++;b.textContent=`${calClicks}/5`;if(calClicks>=5){b.classList.remove('active');b.classList.add('done');setTimeout(()=>{calIndex++;calClicks=0;showCalPoint()},180)}};ov.appendChild(b);$('#calInstruction').innerHTML=`青い丸を<b>見たまま</b>、先生が丸を5回クリックしてください。`;$('#calStatus').textContent=`キャリブレーション ${calIndex+1}/9`}
function drawCalibration(){calibrating=true;calReady=false;calIndex=0;calClicks=0;clearDwell();$('#cameraMessage').classList.remove('on');$('#calibration').classList.add('on');$('#calInstruction').textContent='カメラを準備しています。少しお待ちください。';$('#calStatus').textContent='視線ライブラリとカメラを準備しています…'}
function enableCalibration(){calReady=true;showCalPoint();$('#calStatus').textContent='準備完了：1つ目の青い丸を見てください。'}
function finishCalibration(){calibrating=false;$('#calibration').classList.remove('on');$('#gazeCursor').classList.add('on');$('#gazeDot').className='dot on';setStatus('視線入力中：赤い丸が視線位置です')}
function loadScript(src){return new Promise((res,rej)=>{let s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function loadWebgazer(){if(window.webgazer)return;try{await loadScript('https://cdn.jsdelivr.net/npm/webgazer@3.5.3/dist/webgazer.js')}catch{await loadScript('https://webgazer.cs.brown.edu/webgazer.js')}}
async function startCamera(){drawCalibration();cameraMode=true;$('#gazeDot').className='dot warn';$('#modeText').textContent='操作：Webカメラ視線';if(watchdog)clearTimeout(watchdog);watchdog=setTimeout(()=>{if(calibrating&&!calReady){$('#cameraMessage').innerHTML='カメラ準備に時間がかかっています。<br>①ページを再読み込み<br>②カメラ許可を確認<br>③ChromeまたはEdgeで再度お試しください。';$('#cameraMessage').classList.add('on')}},10000);try{await loadWebgazer();setStatus('カメラを許可してください');webgazer.setGazeListener((data)=>{if(data)handleGaze(data.x,data.y)});try{webgazer.setRegression('ridge')}catch{};await webgazer.begin();try{webgazer.showVideoPreview(true);webgazer.showPredictionPoints(false)}catch{};if(watchdog)clearTimeout(watchdog);enableCalibration()}catch(e){cameraMode=false;if(watchdog)clearTimeout(watchdog);$('#gazeDot').className='dot';$('#modeText').textContent='操作：タッチ／マウス／外部視線装置';$('#calStatus').textContent='カメラを開始できませんでした。';$('#cameraMessage').innerHTML='カメラを開始できませんでした。<br>ブラウザのカメラ許可を確認し、ChromeまたはEdgeで再度お試しください。';$('#cameraMessage').classList.add('on');console.error(e)}}
async function stopCamera(){cameraMode=false;calibrating=false;calReady=false;if(watchdog)clearTimeout(watchdog);clearDwell();$('#calibration').classList.remove('on');$('#cameraMessage').classList.remove('on');$('#gazeCursor').classList.remove('on');$('#gazeDot').className='dot';$('#modeText').textContent='操作：タッチ／マウス／外部視線装置';try{if(window.webgazer)await webgazer.end()}catch{}setStatus('カメラ視線を停止しました')}
$('#cameraStartBtn').onclick=startCamera;$('#pointerModeBtn').onclick=()=>{stopCamera();setStatus('外部視線装置／マウスで操作します')};$('#speakBtn').onclick=speak;$('#clearBtn').onclick=()=>{sentence=[];renderSentence()};$('#undoBtn').onclick=()=>{sentence.pop();renderSentence()};$('#starterBtn').onclick=()=>addFixed('わたしは','わたしは','🙋');$('#wantBtn').onclick=()=>addFixed('ほしい','ほしいです','💭');
$('#settingsBtn').onclick=()=>{$('#dwellSelect').value=dwellMs;$('#sizeSelect').value=cardSize;$('#settingsModal').classList.add('open')};$('#closeSettingsBtn').onclick=()=>$('#settingsModal').classList.remove('open');$('#dwellSelect').onchange=e=>{dwellMs=+e.target.value;save('pecsEyeDwell',dwellMs);$('#dwellText').textContent=(dwellMs/1000).toFixed(1)+'秒'};$('#sizeSelect').onchange=e=>{cardSize=+e.target.value;save('pecsEyeSize',cardSize);renderCards()};$('#recalibrateBtn').onclick=()=>{$('#settingsModal').classList.remove('open');cameraMode?drawCalibration():startCamera();if(cameraMode)setTimeout(()=>enableCalibration(),100)};$('#stopCameraBtn').onclick=()=>{stopCamera();$('#settingsModal').classList.remove('open')};$('#cancelCal').onclick=stopCamera;
$('#dwellText').textContent=(dwellMs/1000).toFixed(1)+'秒';renderTabs();renderCards();renderSentence();bindPointer();
</script>
</body></html>
